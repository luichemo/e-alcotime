<div class="age-verification-overlay" *ngIf="showModal">
  <div class="age-verification-modal">
    <div class="modal-content">
      <div class="verification-icon">
        <i class="bi bi-shield-check"></i>
      </div>

      <div class="modal-logo">
        <h1 class="brand-name">AlcoTime</h1>
      </div>

      <h2 class="modal-title">{{ 'AGE_VERIFY.TITLE' | translate }}</h2>

      <div class="modal-message">
        <p class="main-text">
          {{ 'AGE_VERIFY.MAIN_TEXT' | translate }}
        </p>
        <p class="age-question">
          {{ 'AGE_VERIFY.QUESTION' | translate }}
        </p>
      </div>

      <div class="warning-box">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span>{{ 'AGE_VERIFY.WARNING' | translate }}</span>
      </div>

      <div class="modal-actions">
        <button class="btn-confirm" (click)="confirmAge()">
          <i class="bi bi-check-circle me-2"></i>
          {{ 'AGE_VERIFY.YES' | translate }}
        </button>
        <button class="btn-deny" (click)="denyAge()">
          <i class="bi bi-x-circle me-2"></i>
          {{ 'AGE_VERIFY.NO' | translate }}
        </button>
      </div>

      
    </div>
  </div>
</div>
