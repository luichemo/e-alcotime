<!-- FILE: src/app/components/navbar/navbar.component.html -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/home">
      <img src="rm-log.png" alt="AlcoTime Logo" class="hero-logo mb-4" style="max-width: 50px;">
    </a>
    
    <button 
      class="navbar-toggler" 
      type="button" 
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="isMenuOpen">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/products" routerLinkActive="active">Products</a>
        </li>
      </ul>

      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link position-relative" routerLink="/cart">
            <i class="bi bi-cart3 fs-5"></i>
            <span 
              *ngIf="cartItemCount > 0" 
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
              {{ cartItemCount }}
            </span>
          </a>
        </li>

        <ng-container *ngIf="currentUser$ | async as user; else loginButtons">
          <li class="nav-item dropdown" style="margin-top: 1px;">
            <a 
              class="nav-link dropdown-toggle" 
              href="#" 
              role="button" 
              data-bs-toggle="dropdown">
              <i class="bi bi-person-circle me-1"></i>
              {{ user.email }}
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item" routerLink="/admin">
                  <i class="bi bi-speedometer2 me-2"></i>Admin Panel
                </a>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <a class="dropdown-item" (click)="logout()" style="cursor: pointer;">
                  <i class="bi bi-box-arrow-right me-2"></i>Logout
                </a>
              </li>
            </ul>
          </li>
        </ng-container>

        <ng-template #loginButtons>
          <li class="nav-item">
            <a class="nav-link mt-1" routerLink="/login">Login</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-outline-light btn-sm ms-2 mt-1" routerLink="/register">Register</a>
          </li>
        </ng-template>
      </ul>
    </div>
  </div>
</nav>
