<div class="register-page">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow">
          <div class="card-body p-5">
            <h2 class="text-center mb-4">{{ 'AUTH.CREATE_ACCOUNT' | translate }}</h2>
            
            <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
              <i class="bi bi-exclamation-triangle me-2"></i>
              {{ errorMessage }}
            </div>

            <div *ngIf="successMessage" class="alert alert-success" role="alert">
              <i class="bi bi-check-circle me-2"></i>
              {{ successMessage }}
            </div>

            <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
              <div class="mb-3">
                <label for="displayName" class="form-label">{{ 'AUTH.FULL_NAME' | translate }}</label>
                <input 
                  type="text" 
                  class="form-control" 
                  id="displayName"
                  [(ngModel)]="displayName"
                  name="displayName"
                  required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">{{ 'AUTH.EMAIL' | translate }} *</label>
                <input 
                  type="email" 
                  class="form-control" 
                  id="email"
                  [(ngModel)]="email"
                  name="email"
                  required>
              </div>

              <div class="mb-3">
                <label for="phoneNumber" class="form-label">{{ 'AUTH.PHONE_NUMBER' | translate }}</label>
                <input 
                  type="tel" 
                  class="form-control" 
                  id="phoneNumber"
                  [(ngModel)]="phoneNumber"
                  name="phoneNumber">
              </div>

              <div class="mb-3">
                <label for="dateOfBirth" class="form-label">{{ 'AUTH.DOB' | translate }}</label>
                <input 
                  type="date" 
                  class="form-control" 
                  id="dateOfBirth"
                  [(ngModel)]="dateOfBirth"
                  name="dateOfBirth"
                  [max]="getMaxDate()"
                  required>
                <small class="form-text text-muted">
                  {{ 'AUTH.DOB_NOTICE' | translate }}
                </small>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">{{ 'AUTH.PASSWORD' | translate }} *</label>
                <input 
                  type="password" 
                  class="form-control" 
                  id="password"
                  [(ngModel)]="password"
                  name="password"
                  required>
                <small class="form-text text-muted">
                  {{ 'AUTH.PASSWORD_NOTICE' | translate }}
                </small>
              </div>

              <div class="mb-3">
                <label for="confirmPassword" class="form-label">{{ 'AUTH.CONFIRM_PASSWORD' | translate }}</label>
                <input 
                  type="password" 
                  class="form-control" 
                  id="confirmPassword"
                  [(ngModel)]="confirmPassword"
                  name="confirmPassword"
                  required>
              </div>

              <div class="mb-3 form-check">
                <input 
                  type="checkbox" 
                  class="form-check-input" 
                  id="agreeTerms"
                  [(ngModel)]="agreeTerms"
                  name="agreeTerms"
                  required>
                <label class="form-check-label" for="agreeTerms">
                  {{ 'AUTH.AGREE_TERMS' | translate }}
                </label>
              </div>

              <button 
                type="submit" 
                class="btn btn-primary w-100 mb-3"
                [disabled]="loading || !registerForm.valid">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                {{ (loading ? 'AUTH.CREATING_ACCOUNT' : 'AUTH.REGISTER_BTN') | translate }}
              </button>

              <p class="text-center mb-0">
                {{ 'AUTH.ALREADY_HAVE_ACCOUNT' | translate }}
                <a routerLink="/login" class="text-decoration-none">{{ 'AUTH.LOGIN_HERE' | translate }}</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
