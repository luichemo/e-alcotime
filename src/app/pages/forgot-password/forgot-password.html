<div class="login-page">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card shadow">
          <div class="card-body p-5">
            <h2 class="text-center mb-4">{{ 'AUTH.RESET_PASSWORD' | translate }}</h2>
            
            <p class="text-center  mb-4">
              {{ 'AUTH.RESET_INSTRUCTIONS' | translate }}
            </p>

            <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
              <i class="bi bi-exclamation-triangle me-2"></i>
              {{ errorMessage }}
            </div>

            <div *ngIf="successMessage" class="alert alert-success" role="alert">
              <i class="bi bi-check-circle me-2"></i>
              {{ successMessage }}
            </div>

            <form (ngSubmit)="onSubmit()" #resetForm="ngForm">
              <div class="mb-3">
                <label for="email" class="form-label">{{ 'AUTH.EMAIL' | translate }}</label>
                <input 
                  type="email" 
                  class="form-control" 
                  id="email"
                  [(ngModel)]="email"
                  name="email"
                  [placeholder]="'AUTH.EMAIL' | translate"
                  required
                  [disabled]="loading">
              </div>

              <button 
                type="submit" 
                class="btn btn-primary w-100 mb-3"
                [disabled]="loading || !resetForm.valid || successMessage">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                {{ (loading ? 'AUTH.SENDING' : 'AUTH.SEND_RESET_LINK') | translate }}
              </button>

              <button 
                type="button" 
                class="btn btn-outline-secondary w-100"
                (click)="goBack()"
                [disabled]="loading">
                <i class="bi bi-arrow-left me-2"></i>
                {{ 'AUTH.BACK_TO_LOGIN' | translate }}
              </button>
            </form>
          </div>
        </div>

        <div class="text-center mt-4 text-muted" style="display: flex; justify-content: center; align-items: center;">
          <small>
            <i class="bi bi-info-circle me-1"></i>
            {{ 'AUTH.SPAM_NOTICE' | translate }}
          </small>
        </div>
      </div>
    </div>
  </div>
</div>
