<div class="login-page">
  <!-- Interactive background blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1 class="brand-title">AlcoTime</h1>
        <p class="brand-subtitle">{{ 'AUTH.WELCOME' | translate }}</p>
      </div>

      <div *ngIf="errorMessage" class="alert alert-custom alert-danger animate-fade-in" role="alert">
        <i class="bi bi-exclamation-circle-fill me-2"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
        <div class="form-group">
          <label for="email" class="form-label-custom">
            <span>{{ 'AUTH.EMAIL' | translate }}</span>
          </label>
          <div class="input-wrapper">
            <i class="bi bi-envelope input-icon"></i>
            <input 
              type="email" 
              class="form-input" 
              id="email" 
              [(ngModel)]="email" 
              name="email"
              [placeholder]="'AUTH.EMAIL' | translate" 
              required
              autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="password" class="form-label-custom">
              <span>{{ 'AUTH.PASSWORD' | translate }}</span>
            </label>
            <a routerLink="/forgot-password" class="forgot-password-link">
              {{ 'AUTH.FORGOT_PASSWORD' | translate }}
            </a>
          </div>
          <div class="input-wrapper">
            <i class="bi bi-lock input-icon"></i>
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              class="form-input" 
              id="password" 
              [(ngModel)]="password" 
              name="password"
              [placeholder]="'AUTH.PASSWORD' | translate" 
              required
              autocomplete="current-password">
            <button type="button" class="password-toggle-btn" (click)="togglePasswordVisibility()" aria-label="Toggle password visibility">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" [disabled]="loading || !loginForm.valid">
          <div class="btn-content" *ngIf="!loading">
            <span>{{ 'AUTH.LOGIN_BTN' | translate }}</span>
            <i class="bi bi-arrow-right btn-arrow"></i>
          </div>
          <div class="spinner-container" *ngIf="loading">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            <span>{{ 'AUTH.LOGGING_IN' | translate }}</span>
          </div>
        </button>

        <div class="form-footer">
          <p class="signup-prompt">
            {{ 'AUTH.DONT_HAVE_ACCOUNT' | translate }}
            <a routerLink="/register" class="signup-link">{{ 'AUTH.REGISTER_HERE' | translate }}</a>
          </p>
        </div>
      </form>
    </div>

    <div class="legal-badge animate-fade-in-up">
      <i class="bi bi-shield-fill-check me-2"></i>
      <span>{{ 'AUTH.AGE_NOTICE' | translate }}</span>
    </div>
  </div>
</div>
