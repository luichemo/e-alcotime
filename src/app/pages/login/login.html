<div class="login-page">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card shadow">
          <div class="card-body p-5">
            <h2 class="text-center mb-4">{{ 'AUTH.WELCOME' | translate }}</h2>

            <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
              <i class="bi bi-exclamation-triangle me-2"></i>
              {{ errorMessage }}
            </div>

            <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
              <div class="mb-3">
                <label for="email" class="form-label">{{ 'AUTH.EMAIL' | translate }}</label>
                <input type="email" class="form-control" id="email" [(ngModel)]="email" name="email"
                  [placeholder]="'AUTH.EMAIL' | translate" required>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">{{ 'AUTH.PASSWORD' | translate }}</label>
                <input type="password" class="form-control" id="password" [(ngModel)]="password" name="password"
                  [placeholder]="'AUTH.PASSWORD' | translate" required>
                <div class="text-end mt-2">
                  <a routerLink="/forgot-password" class="text-decoration-none" style="font-size: 0.9rem; color:burlywood;">
                    {{ 'AUTH.FORGOT_PASSWORD' | translate }}
                  </a>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 mb-3" [disabled]="loading || !loginForm.valid">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                {{ (loading ? 'AUTH.LOGGING_IN' : 'AUTH.LOGIN_BTN') | translate }}
              </button>

              <div class="text-center">
                <p class="mb-0">
                  {{ 'AUTH.DONT_HAVE_ACCOUNT' | translate }}
                  <a routerLink="/register" class="text-decoration-none">{{ 'AUTH.REGISTER_HERE' | translate }}</a>
                </p>
              </div>
            </form>
          </div>
        </div>

        <div class="text-center mt-4 text-muted" style="display: flex; justify-content: center; align-items: center;">
          <small>
            <i class="bi bi-shield-check me-1"></i>
            {{ 'AUTH.AGE_NOTICE' | translate }}
          </small>
        </div>
      </div>
    </div>
  </div>
</div>
